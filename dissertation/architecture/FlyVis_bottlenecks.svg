<svg xmlns="http://www.w3.org/2000/svg" width="3900" height="1320" viewBox="0 0 3900 1320"><rect width="100%" height="100%" fill="#FAFBFD"/>
<defs><marker id="rank-arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 Z" fill="#5D537D"/></marker></defs>
<text x="80" y="85" font-family="Segoe UI,Arial,sans-serif" font-size="42" font-weight="700" fill="#182B40">УЗКИЕ МЕСТА FLYVIS — ПРИОРИТЕТЫ НА 25.10.2026</text>
<text x="80" y="162" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#52647A">Одна полоса слева направо: от большего приоритета к меньшему. Стрелки показывают ранг, а не причинность или порядок слоёв.</text>
<path d="M1180,610.0 L1400,670.0" stroke="#5D537D" stroke-width="7" marker-end="url(#rank-arrow)"/>
<path d="M2500,670.0 L2720,610.0" stroke="#5D537D" stroke-width="7" marker-end="url(#rank-arrow)"/>
<rect x="80" y="240" width="1100" height="740" rx="28" fill="#FFE1DE" stroke="#B33838" stroke-width="3"/>
<text x="112" y="304" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#182B40">1 ВЫБОР ПОЛЕЗНОЙ ПОПРАВКИ</text>
<text x="112" y="364" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">ПОДТВЕРЖДЁННАЯ НЕРЕШЁННАЯ ЗАДАЧА</text>
<text x="112" y="400" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40"></text>
<text x="112" y="436" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">Выбрать реальную область либо сохранить исходное назначение.</text>
<text x="112" y="472" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40"></text>
<text x="112" y="508" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">Идеальный запас строгих рамочных действий: +5,14 п.п. на 26 видео; это не</text>
<text x="112" y="544" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">качество модели.</text>
<text x="112" y="580" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40"></text>
<text x="112" y="616" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">Межкадровый считыватель: -0,030 п.п. [-0,092; +0,035] на 104 видео.</text>
<text x="112" y="652" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40"></text>
<text x="112" y="688" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">Критерий +2 п.п. и все шесть сравнений не пройдены. Польза стенду не</text>
<text x="112" y="724" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">подтверждена.</text>
<rect x="1400" y="300" width="1100" height="740" rx="28" fill="#FFF0BE" stroke="#AB790F" stroke-width="3"/>
<text x="1432" y="364" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#182B40">2 ЛИЧНОСТЬ ОБЪЕКТА ВО ВРЕМЕНИ</text>
<text x="1432" y="424" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">РЕАЛИЗАЦИЯ ПРОВЕРЕНА; ПРИЧИНА НЕ УСТАНОВЛЕНА</text>
<text x="1432" y="460" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40"></text>
<text x="1432" y="496" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">Явные метки личности реальных областей, обучаемое отсутствие пары;</text>
<text x="1432" y="532" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">одинаковые D / C / вход / геометрия.</text>
<text x="1432" y="568" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40"></text>
<text x="1432" y="604" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">90 моделей: 3 начальных состояния, 5 разбиений, 6 вариантов. Выбор действий</text>
<text x="1432" y="640" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">не улучшен.</text>
<text x="1432" y="676" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40"></text>
<text x="1432" y="712" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">AUROC пар около 0,910 — условная диагностика без интервала по видео, не</text>
<text x="1432" y="748" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">польза трекеру.</text>
<text x="1432" y="784" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40"></text>
<text x="1432" y="820" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">Не проверена передача принадлежности цели через цепочку соответствий.</text>
<text x="1432" y="856" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">Это следующая гипотеза, не установленная причина.</text>
<rect x="2720" y="240" width="1100" height="740" rx="28" fill="#FFF0BE" stroke="#AB790F" stroke-width="3"/>
<text x="2752" y="304" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#182B40">3 ПОДГОТОВКА ВРЕМЕННЫХ ПАР</text>
<text x="2752" y="364" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">РАВНЫЕ ПРИЗНАКИ ПОДГОТОВЛЕНЫ И ПРОВЕРЕНЫ</text>
<text x="2752" y="400" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40"></text>
<text x="2752" y="436" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">18 824 из 37 296 запросов (50,47%) получили прежние реальные области на</text>
<text x="2752" y="472" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">одной опорной сетке.</text>
<text x="2752" y="508" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40"></text>
<text x="2752" y="544" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">D / C / вход глаза: одни наблюдения, области и маски; прежний ответ</text>
<text x="2752" y="580" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">воспроизведён в заданном допуске.</text>
<text x="2752" y="616" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40"></text>
<text x="2752" y="652" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">22 090 пар другой подготовки используют ближайший кадр без требования</text>
<text x="2752" y="688" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">разметки. Эти правила выбора не совпадают.</text>
<text x="2752" y="724" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40"></text>
<text x="2752" y="760" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">Ограничение охвата осталось. Нехваткой равных признаков отрицательный</text>
<text x="2752" y="796" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">результат уже не объясняется.</text>
<rect x="80" y="1110" width="3740" height="150" rx="22" fill="#EEF1F7" stroke="#A5AFC0"/>
<text x="108" y="1166" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#34445A">Ранг не задаёт порядок расчётов. Межкадровая реализация проверена; точная причина неудачи не установлена. Пространственный считыватель v1 временно отложен. Результаты относятся к своим выборкам, не к HOTA.</text>
</svg>