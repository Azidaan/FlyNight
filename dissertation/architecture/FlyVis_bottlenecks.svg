<svg xmlns="http://www.w3.org/2000/svg" width="3900" height="1320" viewBox="0 0 3900 1320"><rect width="100%" height="100%" fill="#FAFBFD"/>
<defs><marker id="rank-arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 Z" fill="#5D537D"/></marker></defs>
<text x="80" y="85" font-family="Segoe UI,Arial,sans-serif" font-size="42" font-weight="700" fill="#182B40">УЗКИЕ МЕСТА FLYVIS — ПРИОРИТЕТЫ НА 25.10.2026</text>
<text x="80" y="162" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#52647A">Одна полоса слева направо: от большего приоритета к меньшему. Стрелки показывают ранг, а не причинность или порядок слоёв.</text>
<path d="M1180,610.0 L1400,670.0" stroke="#5D537D" stroke-width="7" marker-end="url(#rank-arrow)"/>
<path d="M2500,670.0 L2720,610.0" stroke="#5D537D" stroke-width="7" marker-end="url(#rank-arrow)"/>
<rect x="80" y="240" width="1100" height="740" rx="28" fill="#FFE1DE" stroke="#B33838" stroke-width="3"/>
<text x="112" y="304" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#182B40">1 ВЫБОР ПОЛЕЗНОЙ ПОПРАВКИ</text>
<text x="112" y="364" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">ПОДТВЕРЖДЁННАЯ НЕРЕШЁННАЯ ЗАДАЧА</text>
<text x="112" y="400" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40"></text>
<text x="112" y="436" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">Выбрать реальную область либо сохранить исходное назначение.</text>
<text x="112" y="472" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40"></text>
<text x="112" y="508" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">Идеальный запас рамочных действий: +5,14 п.п. [+4,16; +6,11] на 26 видео. Это</text>
<text x="112" y="544" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">не качество модели.</text>
<text x="112" y="580" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40"></text>
<text x="112" y="616" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">Последний считыватель: -0,01 п.п.; интервал включает 0 на 104 видео.</text>
<text x="112" y="652" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">Критерий не пройден.</text>
<text x="112" y="688" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40"></text>
<text x="112" y="724" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">Нужно доказать: сигнал мухи даёт пользу сверх того же решения без мухи.</text>
<rect x="1400" y="300" width="1100" height="740" rx="28" fill="#DFEBFF" stroke="#416FBA" stroke-width="3"/>
<text x="1432" y="364" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#182B40">2 ЛИЧНОСТЬ ОБЪЕКТА ВО ВРЕМЕНИ</text>
<text x="1432" y="424" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">РАБОЧАЯ ГИПОТЕЗА, ПРИЧИНА НЕ ДОКАЗАНА</text>
<text x="1432" y="460" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40"></text>
<text x="1432" y="496" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">Связать текущую область с прежним объектом и отличить его от похожего</text>
<text x="1432" y="532" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">соседа.</text>
<text x="1432" y="568" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40"></text>
<text x="1432" y="604" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">У FlyVis уже есть рекуррентное состояние и обновление на кадрах поиска.</text>
<text x="1432" y="640" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40"></text>
<text x="1432" y="676" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">Обучаемые соответствия всех реальных областей между наблюдениями в</text>
<text x="1432" y="712" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">текущей серии не проверены. Прежние варианты трёх пиков не дали нужного</text>
<text x="1432" y="748" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">эффекта.</text>
<text x="1432" y="784" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40"></text>
<text x="1432" y="820" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">Проверка: равные D / C / вход глаза / без мухи и прежний способ выбора.</text>
<rect x="2720" y="240" width="1100" height="740" rx="28" fill="#FFF0BE" stroke="#AB790F" stroke-width="3"/>
<text x="2752" y="304" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#182B40">3 ПОДГОТОВКА ВРЕМЕННЫХ ПАР</text>
<text x="2752" y="364" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">ССЫЛКИ ПОДГОТОВЛЕНЫ; ПРИЗНАКИ НУЖНО ПРОВЕРИТЬ</text>
<text x="2752" y="400" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40"></text>
<text x="2752" y="436" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">Расширено с 14252 до 22090 пар из 37296 (59,2%),</text>
<text x="2752" y="472" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40"></text>
<text x="2752" y="508" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">Идеальный запас на 26 видео: +5,14 п.п. [+4,16; +6,11], раньше +2,07 п.п.</text>
<text x="2752" y="544" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40"></text>
<text x="2752" y="580" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">Найдены более ранние наблюдения в том же эпизоде; текущие области</text>
<text x="2752" y="616" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">воспроизведены точно.</text>
<text x="2752" y="652" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40"></text>
<text x="2752" y="688" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">Следом: равные признаки D/C/R1 и проверка прежнего ответа. Это подготовка</text>
<text x="2752" y="724" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#182B40">данных, не улучшение модели или её памяти.</text>
<rect x="80" y="1110" width="3740" height="150" rx="22" fill="#EEF1F7" stroke="#A5AFC0"/>
<text x="108" y="1166" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#34445A">Порядок выполнения отдельный: подготовку временных данных начинают с №3. Пространственный считыватель v1 временно отложен; к нему можно вернуться позже. Результаты относятся к своим выборкам, не к HOTA.</text>
</svg>