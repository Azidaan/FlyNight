topic: 'Что сейчас полезно проекту: признаки сшивки и повторного опознания, улучшения трекера линии B, все возможности улучшить муху (FlyVis) — с 2024 года'
created: '2026-09-30'
context: 'Проект: многообъектный трекинг BDD100K (ночь, пересвет, окклюзия, сложный фон), детектор YOLO26 заморожен,

  трекер XYWHByteTrack; муха — FlyVis (Lappalainen et al., Nature 2024) как фовеальный глаз на трек, с сетчаткой-ламиной.

  Уже измерено (30.09.2026): сшивка треков по одной геометрии даёт +0,79 HOTA test (почти весь прирост), внешность +0,08,

  вход глаза −0,04, муха 0,00 (runs/fly_reid_ablation); сигнатура мухи одна даёт +0,14 AP к геометрии, поверх внешности ~0;

  ламина значимо устраняет ночной провал мухи (+0,009 AP, ДИ > 0); буфер/каскад IoU +1,1 % HOTA; муха в трекере — 0.

  Уже найдено поиском: Kuklev arXiv 2609.24565 (FlyVis как дескриптор чертежей; фоторецепторы 0,894 > полная схема 0,835).

  '
items:
- id: A1
  name: 'Простая внешность: гистограммы цвета, уменьшенные картинки — когда их хватает'
  block: A
  description: 'Цель пользователя: найти работы (желательно с 2024 г.), которые уже хорошо работают в трекинге объектов в сложных сценах (переэкспонирование, плохое освещение, частичная окклюзия, сложный фон), и понять, можно ли их интересно и эффективно перенести на муху (FlyVis — коннектомная модель зрения дрозофилы, Lappalainen et al. Nature 2024, фовеальный глаз на каждый трек) так, чтобы это можно было сразу протестировать. Что уже измерено в проекте: сетчатка-ламина перед мухой значимо устраняет ночной провал мухи в голове надёжности; сигнатура мухи несёт идентичность объекта (+0,14 AP к геометрии), топология коннектома для неё значима (+0,044 AP против перемешанного), но поверх её входа (721 фасетка) муха добавляет лишь +0,006 AP (ночью +0,010) и до HOTA не доходит; сшивка треков по одной геометрии даёт +0,79 HOTA; муха в роли потока/надёжности избыточна относительно DIS; детектор YOLO26 заморожен, BDD100K 30 Гц, разметка 5 Гц.'
