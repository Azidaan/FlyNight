# Служебный гейт фиксированного фильтра: 12 эпох.
#
# ЧТО ЭТО. Проверка работоспособности, НЕ источник выводов. Урок хроники от
# 25.08: на двенадцати эпохах мозаика работает две эпохи из двенадцати, а на
# ста — девяносто из ста, и мозаика сама изготавливает мелкие объекты. Знак
# эффекта по мелким объектам от этого переворачивается: +0.027 на коротком
# обучении обернулись −0.032 на полном. Поэтому здесь смотрят только на то,
# что обучение доходит до конца, лосс падает, NaN нет, а итоговая mAP50 не
# провалилась против известного двенадцатиэпошного контроля 0.4254 ± 0.0144.
#
# ЧЕМ ОТЛИЧАЕТСЯ ОТ baseline.yaml. Ничем, кроме числа эпох и вставки фильтра.
# Фильтр вставляется тренером (training/train_lowpass.py), в конфиге данных
# и гиперпараметров различий нет — условие честного сравнения.

weights: weights/pretrained/yolo26s.pt
data_name: full_step5          # та же генерируемая конфигурация данных, что у baseline
frame_step_train: 5
frame_step_val: 5

epochs: 12
batch: 16
imgsz: 640
workers: 4                  # замер: 8 загрузчиков дают -8%, узкое место — диск
block_epochs: 10

run_name: lowpass12

# --- параметры фиксированного фильтра ---
# Обучаемых чисел ноль: и ядро, и сила — константы. Сеть не может ни
# изменить форму фильтра, ни свести его вклад к нулю. В этом весь замысел:
# обучаемая маска сходилась к нейтрали четырежды из четырёх.
lowpass_placement: upsample   # upsample (слои 11, 14) | levels (16, 19, 22)
lowpass_kernel: 5
lowpass_sigma: 1.0
lowpass_strength: 1.0         # 1.0 = путь после апсемплинга полностью сглажен
