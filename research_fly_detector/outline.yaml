–2026), которые реально дают прирост детекции против сильной базы в сложных условиях (ночь, пересвет, заслонение, мелкие, сложный фон), и ответ: как туда встраивается муха и как это дёшево проверить до дорогого обучения.'
- id: D3
  name: 'Фигура и фон по движению: лобула (LC, LPLC2) и сегментация движущихся объектов при движении камеры'
  block: A
  focus: Как муха отделяет объект от фона по относительному движению (figure-ground, LC-нейроны, LPLC2 — надвигание); вычислительные модели; сегментация и открытие движущихся объектов в видео вождения 2023–2026 (motion segmentation, компенсация собственного движения); может ли карта «движется не как фон» давать предложения рамок или поднимать уверенность при рождении объекта.
  description: 'Цель пользователя: детектор с мухой (FlyVis — коннектомная модель зрения дрозофилы, Lappalainen et al., Nature 2024), по возможности лучше YOLO26, и максимально полезный для уже полученных результатов. Факты проекта. Детектор: YOLO26s (Ultralytics, NMS-free), обучен на BDD100K MOT (1400 видео, разметка 5 Гц, видео 30 Гц, камера на движущемся автомобиле) при imgsz 640, работает на 960; RTX 5070 12 ГБ, 12 эпох ≈ 4,3 ч. Потери детектора (960, val): слепота (объекта нет среди кандидатов даже при conf 0.01) 4,5% ночью и днём одинаково; потери на пороге 21,0% ночью против 15,5% днём — кандидат есть, но уверенность занижена (ночью на +0,098); найдено мелких 56,7%; объект в момент первого появления (возраст 0) найден в 31% ночью против 68% при возрасте 10+, 2/3 разрыва — через порог; ночной штраф для заслонённых в 5,4 раза выше. Постобработочная коррекция балла по классу, геометрии и состоянию сцены AUC не подняла (0,9025 → 0,9005). Итоговый трекер (каскад буферов + отложенное рождение + сшивка): HOTA 58,47 → 59,27, но DetA не изменилась (58,21 → 58,17), FN 15 763 и FP 8 242 против IDSw 2 221 — потолок в обнаружении. Прежняя неудача на детекторе (DRB: пространственная и частотная ветви в neck YOLO): разброс сидов 0,0144 mAP на 12 эпохах, знак прироста перевернулся на 100 эпохах, одна ветвь не получала градиента, +17% времени; ночная mAP50 контроля 0,3772 ± 0,0031. Муха: 45 669 нейронов, 65 типов (сетчатка–ламина–медулла, T4/T5 — детекторы направления движения), 1,5 млн связей, 734 свободных параметра, параметры общие для типа клетки (по сути свёрточная рекуррентная сеть на гексагональной решётке); сейчас используется как фовеальный глаз (721 фасетка) на каждый трек; сетчатка-ламина перед мухой устраняет её ночной провал (выигрыш специфичен для мухи, оптическому потоку DIS не помогает); сигнатура мухи несёт идентичность, топология коннектома значима (+0,044 AP против перемешанного). Модифицировать муху можно без ограничений. Нужны работы (предпочтительно 2023–2026), которые реально дают прирост детекции против сильной базы в сложных условиях (ночь, пересвет, заслонение, мелкие, сложный фон), и ответ: как туда встраивается муха и как это дёшево проверить до дорогого обучения.'
- id: D4
  name: 'Новая модальность в обученном YOLO без вреда: адаптеры с нулевой инициализацией и слияние RGB-T'
  block: B
  focus: Адаптеры с нулевой инициализацией (ControlNet zero conv), ранняя, средняя и поздняя фузия дополнительной модальности в YOLO-детекторах; многоспектральная ночная детекция (LLVIP, FLIR, M3FD, KAIST) — какой уровень слияния работает и с каким приростом против сильной одномодальной базы; применимость к каналу мухи как псевдомодальности.
