–2026), которые реально дают прирост детекции против сильной базы в сложных условиях (ночь, пересвет, заслонение, мелкие, сложный фон), и ответ: как туда встраивается муха и как это дёшево проверить до дорогого обучения.'
- id: D5
  name: 'Каналы движения на входе детектора: поток, разность кадров, CenterTrack, псевдособытия'
  block: B
  focus: Детекторы, получающие на вход движение (оптический поток, разность кадров, предыдущий кадр и тепловая карта прошлых детекций как в CenterTrack и PermaTrack), RGB и события для вождения ночью (DSEC-Det, PKU-DAVIS-SOD, псевдособытия v2e); прирост на мелких, ночных и рождающихся объектах; контроль «тот же вход без биомодели» — ключ к сравнению мухи с потоком DIS.
