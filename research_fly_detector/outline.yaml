  focus: Почему детектор занижает уверенность на ночных и только что появившихся объектах и как это лечат обучением (Varifocal, quality focal, PISA, взвешивание по трудности, калибровка детекторов 2023–2026); связь с нашим рельсом «взвешивание по возрасту объекта»; может ли муха дать вес (временное свидетельство) — взвешивание по мухе.
