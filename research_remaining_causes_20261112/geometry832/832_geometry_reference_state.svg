  <g id="text_18">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start" x="30.528" y="61.2" transform="rotate(-0 30.528 61.2)">C34, исходный C34-сдвиг; порог принятия во всех ячейках один: &gt; 0</text>
  </g>
  <g id="text_19">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(30.528 364.954437)">Во всех четырёх условиях: те же 149 ячеек, веса, текущая карта и 7 геометрических признаков головы.</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(30.528 380.915094)">Удержание: ранее сохранённая синтетическая история конечного исходного изображения.</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(30.528 396.576)">GT — эталонная рамка; это диагностическое вмешательство с известной разметкой.</text>
  </g>
  <g id="text_20">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #4b5563" transform="translate(30.528 443.538812)">Около 12 пикселей — поправка между двумя правилами координат, а не измеренное движение детали.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #4b5563" transform="translate(30.528 457.776)">Соответствие физических частей, полная траектория и HOTA здесь не проверены.</text>
  </g>
