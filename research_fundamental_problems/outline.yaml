- id: F3
  name: 'Место подключения модуля: вход, промежуточные признаки, решение (раннее / среднее / позднее слияние)'
  block: B
  focus: Где в сети модуль может помочь; почему пересчёт после решения и подмена входа проигрывают; промежуточное слияние с обучаемым мостом; данные по RGB-T, RGB-событиям 2022–2025.
