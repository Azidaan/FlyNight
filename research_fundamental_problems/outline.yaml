- id: F5
  name: 'Ветвь проигрывает конкуренцию: дисбаланс модальностей, жадное обучение, гибель слабой ветви'
  block: B
  focus: 'OGM-GE (CVPR 2022), Wu et al. 2022, BalanceBenchmark 2025: почему сеть берёт лёгкий источник и бросает слабую ветвь (DRB: вес 0); модуляция градиента, вспомогательные потери на ветвь.'
