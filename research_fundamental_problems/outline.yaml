- id: F8
  name: 'Улучшение для глаза не равно улучшению для детектора: задаче-ориентированная предобработка'
  block: C
  focus: 'LIME-Eval 2024, Trash to Treasure 2023, Dark-ISP 2025: усиление слабого света под человека вредит детекции; обучение предобработки от потери детекции.'
  description: 'Проект: магистерская диссертация, многообъектный трекинг на BDD100K MOT в трудных условиях (ночь, пересвет, заслонение). Детектор YOLO26s (обучен при 640 на 1400 видео, работает на 960), трекер XYWHByteTrack; предмет — коннектомная модель зрения дрозофилы FlyVis (Lappalainen et al., Nature 2024; 734 свободных параметра, обучена на оптическом потоке Sintel), модифицировать можно без ограничений. Что не сработало (все числа измерены с бутстрепом по видео): DRB — пространственная и частотная ветви в neck YOLO: вес одной ветви = 0 во всех 896 каналах, частотная маска сошлась к нейтрали 4 из 4, разброс сидов 0,0144 mAP на 12 эпохах, знак перевернулся на 100 эпохах, +17 % времени; муха как источник движения: ошибка 52,77 px против 4,87 px у DIS, в трекере ΔHOTA ≈ 0; муха как сигнатура опознания: +0,14 AP к геометрии, но поверх своего входа (721 фасетка) лишь +0,006, муха одна хуже входа (−0,052); перемешанный коннектом: −0,044 AP у мухи одной, поверх входа разница незначима; сетчатка-ламина перед мухой: устраняет ночной провал мухи (+0,016), DIS не помогает (+0,001); итоговый трекер: HOTA 58,47 → 59,27, но DetA не изменилась (58,21 → 58,17), FN 15 763 ≫ IDSw 2 221, сшивка по одной геометрии +0,79 HOTA, внешность и муха сверх неё незначимы; детектор: слепота 4,5 % ночью и днём, потери на пороге 21,0 % ночью против 15,5 % днём; пересчёт слабых кандидатов по тубелету 5 Гц и 30 Гц с движением относительно фона — ≈ 0 при равном FP; неточная рамка коррелирует с ~40 % ночного занижения, но дообучение без умножения цели на IoU — ноль; замороженный YOLO26 на кадрах после фоторецептора мухи и накопления кадров — хуже на 2–15 пп, растёт слепота (сдвиг входа); сид Ultralytics при дообучении от одних весов ничего не меняет. Вопрос пользователя: с какими фундаментальными проблемами мы столкнулись («модуль стоит не в том месте» и подобные), почему не работают задумки, и как с этим бороться — особенно чтобы улучшить муху дальше.'
