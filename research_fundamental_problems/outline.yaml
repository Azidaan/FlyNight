- id: F6
  name: 'Замороженные части и совместное обучение: когда модули надо учить вместе (co-adaptation)'
  block: C
  focus: Почему подключение замороженных модулей «как есть» не работает; совместное обучение конвейеров (детекция+трекинг, сквозные трекеры), частичная разморозка; конфликт градиентов (OneTrack).
