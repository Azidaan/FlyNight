- id: F7
  name: 'Цель обучения не совпадает с целью оценки: суррогатные потери и разрыв между прокси и итоговой метрикой'
  block: C
  focus: Муха обучена на потоке Sintel, применялась к опознанию; AP пар не доходит до HOTA; обучение от итоговой метрики, дифференцируемые метрики трекинга, задаче-ориентированная предобработка.
