- id: F4
  name: Адаптеры с нулевой инициализацией и параллельные ветви, которые не ломают готовую систему
  block: B
  focus: ControlNet zero conv, zero-init адаптеры для замороженных сетей; как отделить «вредно» от «бесполезно»; муха → нулевая свёртка → P3 замороженного YOLO26.
