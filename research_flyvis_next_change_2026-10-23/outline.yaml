topic: 'Следующее изменение FlyVis для З13: прежняя цель среди похожих, отказ, модель цели и память, обучение ядра через применяемое считывание, последствия поправки для сопоставления траекторий'
created: '2026-10-23'
time_range: классические первоисточники 2018–2022 + новые работы с 2023 года
context: 'Проект: модернизированная FlyVis (ядро 734 обучаемых параметра, вход 721 серая колонка, 34 выходных типа) для многообъектного трекинга BDD100K MOT; окружение проверки YOLO26s + XYWHByteTrack +
  MASA; итоговая метрика HOTA, парный бутстрэп по видео. Задача З13: при потере трека по 4 наблюдениям образца найти именно прежний объект среди похожих в вырезке вокруг прогноза или отказаться; поправка
  центра прогноза перед сопоставлением. Испытано у нас (каталог experiments/project_history.json, карточки z13_*): заранее обученное сопоставление с образцом с классом отсутствия и отрицательными примерами;
  онлайн-модель цели (гребневая регрессия по последнему кадру образца, по мотивам DiMP; центрированный вариант); оценки полезности по признакам карты и геометрии, парные цели, ранжирование трёх пиков, память
  отдельных наблюдений, чтение памяти по запросу, запрет граничного пика, абсолютная высота отклика, равный вес цели и фона, односторонняя ошибка фона (идёт), обучение ядра через модель цели, продолжение
  обучения ядра. Подтверждено: признаки C/D сильнее входа глаза в онлайн-модели цели (D +8,83 п.п. к R1, train26); центрированная D лучше прежней на dev35 (+3,99 п.п.), но D не лучше C (−3,04 п.п. [−10,26;
  +1,51]); отбор вмешательств не решён (2 полезных из 84 выбранных, z13_balanced_ridge_v1); HOTA центрированной D 61,6584 против 61,6548 стенда (z13_center_hota_v1); разобран один случай R1: поправка 79,7
  px подняла стоимость правильного сопоставления 0,123 → 1,0 при пороге 0,8 (z13_first_divergence_v1). train26 и dev35 многократно использованы; отложенные 75 видео — только для окончательной проверки.'
mandatory_question: 'Для каждой работы: чем механизм отличается от уже испытанного у нас? Если отличия нет — работа остаётся источником объяснения, но не основанием повторить тот же опыт.'
questions:
- '5.1 Правильный объект и отказ: где различаются «цель найдена / похожий объект / цель вне области / данных мало» — в представлении, модели цели, памяти, функции ошибки или отдельном решении; наличие максимума
  карты ≠ наличие нужного объекта.'
- '5.2 Модель цели и память: соседи как отрицательные примеры; обновление без подмены моделью соседа и без закрепления ошибки; хранение нескольких наблюдений при окклюзии; что работает на малых признаках
  движения и яркости, а что требует богатого внешнего вида RGB.'
- '5.3 Обучение ядра через фактически применяемое считывание: основания, цель обучения, примеры, сравнения с штатной C; отделение пользы представления от оптимизатора и выходной головы.'
- '5.4 Польза для сопоставления: связь предложенного ответа с назначением детекций и сохранением идентификатора; модернизация FlyVis против внешнего защитного правила с тем же эффектом.'
items:
- id: N01
  name: KeepTrack (Mayer et al. ICCV 2021) — сопоставление кандидатов цели и отвлекающих объектов во времени и управление памятью
  group: первая
  description: 'Learning Target Candidate Association to Keep Track of What Not to Track. Разобрать весь механизм: кандидаты → соответствия между кадрами → выбор цели → обновление памяти с учётом уверенности
    в сохранённом примере; вариант «цель исчезла / новый кандидат»; абляции (вклад сопоставления, памяти, обучения без полной разметки). Что из этого переносимо в считывание FlyVis при окне в 2 раза больше
    цели и 34 признаках движения; отличие от нашего ранжирования трёх пиков и покадрового сопоставления кандидатов (z13_candidate_identity_v1, z13_candidate_ranker_v1).'
- id: N02
  name: Siam R-CNN (Voigtlaender et al. CVPR 2020) — повторное обнаружение и динамическое программирование по траекториям цели и отвлекающих объектов
  group: первая
  description: 'Siam R-CNN: Visual Tracking by Re-Detection. Механизм Tracklet Dynamic Programming: держать треклеты всех похожих объектов и выбирать последовательность для цели с учётом всей истории; абляции
    (без TDPA, только покадровый выбор). Чем это отличается от нашего покадрового выбора центра; можно ли выполнить на эпизодах потери до 30 кадров; стоимость.'
- id: N03
  name: DiMP / PrDiMP (Bhat et al. ICCV 2019; Danelljan et al. CVPR 2020) — обучение признаков через предсказатель модели цели
  group: первая
  description: Learning Discriminative Model Prediction for Tracking; Probabilistic Regression for Visual Tracking. Разобрать §4.1 и табл. 2 DiMP (обучение основы через предсказатель модели цели против
    фиксированных признаков), обучаемую функцию ошибки и инициализатор; PrDiMP — вероятностная регрессия положения. Что именно должно обучаться в ядре FlyVis, какие примеры, контроль штатной C; отличие
    от нашего z13_aligned_core_v1 и z13_next_differentiable_v1.
- id: N04
  name: ToMP (Mayer et al. CVPR 2022) — предсказание параметров модели цели преобразователем вместо оптимизации
  group: первая
  description: Transforming Model Prediction for Tracking. Как получают модель цели (обучаемый предсказатель весов по обучающим кадрам и кодированию положения), абляции против оптимизационного DiMP; где
    различаются цель и отвлекающие объекты; какие признаки нужны. Отличие от нашей гребневой модели цели и от заранее обученного сопоставления с образцом.
- id: N05
  name: KYS (Bhat et al. ECCV 2020) — перенос состояния сцены, включая соседей, по плотному соответствию
  group: вторая
  description: 'Know Your Surroundings: Exploiting Scene Information for Object Tracking. Векторы состояния по положениям, переносимые между кадрами по соответствию, различают цель и отвлекающие объекты;
    абляции. Можно ли реализовать как рекуррентное состояние или считывание FlyVis в подвижной вырезке; отличие от нашей памяти наблюдений.'
- id: N06
  name: STMTrack (Fu et al. CVPR 2021) — пространственно-временная память наблюдений вместо одного образца
  group: вторая
  description: 'STMTrack: Template-free Visual Tracking with Space-time Memory Networks. Как хранится и читается история нескольких кадров; абляции по числу кадров памяти и способу чтения; зависимость от
    признаков внешнего вида. Отличие от наших z13_observed_memory_v1 и z13_query_memory_v1 (обе — основной критерий не выполнен).'
- id: N07
  name: Linsley et al. NeurIPS 2021 — слежение без повторного узнавания среди одинаковых отвлекающих объектов (PathTracker, InT)
  group: вторая
  description: Tracking Without Re-recognition in Humans and Machines. Проверить, можно ли перенести механизм слежения по движению на активность FlyVis (не считать заранее близким к FlyVis); работа опирается
    на биологические механизмы — не независимый инженерный подход. Задача, данные, переход на реальные видео (если есть), абляции рекуррентного механизма; что нужно для переноса (длина истории, плотность
    кадров).
- id: N08
  name: 'LTMU (Dai et al. CVPR 2020) — метаобновитель: когда обновлять модель цели; повторное обнаружение при исчезновении'
  group: вторая
  description: High-Performance Long-Term Tracking with Meta-Updater. Обучаемое решение об обновлении, признаки решения, защита от закрепления ошибки; абляции; оценка отсутствия цели (VOT-LT, OxUvA). Перенос
    на обновление образца FlyVis во время потери.
- id: N09
  name: STARK / MixFormer (Yan et al. ICCV 2021; Cui et al. CVPR 2022) — обновление образца по оценке надёжности
  group: вторая
  description: 'Learning Spatio-Temporal Transformer for Visual Tracking; MixFormer: End-to-End Tracking with Iterative Mixed Attention. Голова оценки для обновления динамического образца, как она обучается,
    что показывают абляции; отличие от наших голов полезности (z13_next_utility_v1, z13_map_utility_v1).'
- id: N10
  name: SiamMOT (Shuai et al. CVPR 2021) и работы, где предложение одиночного трекера входит в стоимость сопоставления MOT
  group: сквозная
  description: 'SiamMOT: Siamese Multi-Object Tracking; найти 1–2 работы с 2023 года, где поправка положения из одиночного трекера или модели цели влияет на назначение детекций. Как связывают предложение
    с сопоставлением и сохранением ID; абляции на HOTA/IDF1; отделить модернизацию FlyVis от внешнего защитного правила (ограничение сдвига, проверка стоимости), дающего тот же эффект. Связь с нашим разобранным
    случаем R1 (сдвиг 79,7 px, стоимость 0,123 → 1,0). Добавлено после поиска пропусков: TrackTrack «Focusing on Tracks» (Shim et al., CVPR 2025; код kamkyu94/TrackTrack) — сопоставление с точки зрения
    трека, кандидаты включая низкоуверенные, подавление новых треков рядом с активным: куда может входить поправка мухи; MOTIP (arXiv 2403.16848) — номер объекта как классификация с классом «новый»; ввести
    поле association_entry_point.'
- id: N11
  name: Tokmakov et al. ICCV 2021 — память перекрытых объектов (object permanence) в многообъектном трекинге
  group: сквозная
  description: Learning to Track with Object Permanence. Механизм памяти невидимых объектов, обучение (в том числе на синтетических данных с разметкой невидимых объектов); отдельно проверить, переносим
    ли механизм с нашей разметкой (5 к/с, только видимые объекты), иначе рекомендация потребует другого обучающего материала; абляции.
- id: N12
  name: 'Оценка уверенности и отказа: когда уверенность перестаёт различать правильные и ошибочные ответы и как проверить это у нас'
  group: сквозная
  description: 'Jaeger, Lüth, Klein, Bungert. A Call to Reflect on Evaluation Practices for Failure Detection in Image Classification (ICLR 2023) — методика проверки, классификация изображений, не трекинг;
    Feng, Ahmed, Hajimirsadeghi, Abdi. Towards Better Selective Classification (ICLR 2023); при наличии — работы об оценке неопределённости/отказа в трекинге. При каких условиях оценка уверенности теряет
    различение; какая проверка у нас покажет, происходит ли это (кривая риск–покрытие, AURC, сдвиг train26 → dev35). Добавлено: Detecting Object Tracking Failure via Sequential Hypothesis Testing (arXiv
    2602.12983) — последовательный тест с заданной долей ложных тревог против покадровых эвристик пика/энтропии; TAPIR (arXiv 2306.08637) / CoTracker3 — раздельные головы «закрыто» и «точно»; AFAT (arXiv
    2005.13708), FuCoLoT (arXiv 1711.09594) — история качества карты как контроль. Числа CoTracker3 (90,2 % / 77,9 %) взяты из вторичного источника — проверить.'
- id: N13
  name: 'Отрицательные абляции и контрпримеры: где обработка отвлекающих объектов, память или онлайн-модель цели не помогают'
  group: сквозная
  description: 'Найти первичные работы или абляции, где механизмы N01–N09 не дают выигрыша, ухудшают результат или работают только при наличии цели; условия переноса (размер окна поиска, признаки, плотность
    похожих объектов). Добавлено: DanceTrack (arXiv 2111.14690) — одинаковые по виду объекты, внешность мало помогает; SAMURAI против SAM2 — уверенность качества вводит в заблуждение среди похожих.'
- id: N14
  name: 'Новые работы с 2023 года: различение отвлекающих объектов, память и отказ в одиночном и многообъектном трекинге'
  group: сквозная
  description: 'Поиск 2023–2026 (например, работы на LaSOT/LaSOText, VOT-LT, DiDi, о «distractor-aware memory», «target-absent», повторном обнаружении). Только первичные работы с абляциями; не добирать
    количество. Проверить существование и первоисточники (взяты по памяти, в поиске не найдены): SAM2Long (дерево гипотез памяти), ODTrack (AAAI 2024, временные токены), MeMOTR (ICCV 2023, память трека);
    SambaMOTR (arXiv 2410.01806, MaskObs), SLAck (ECCV 2024, arXiv 2409.11235), CAMELTrack (arXiv 2505.01257, обучение вокруг решения о связи), ADPTrack (arXiv 2405.15137), arXiv 2311.02572, arXiv 2508.14370.'
- id: N15
  name: Модели насекомых с выбором цели (без приоритета)
  group: сквозная
  description: 'Проверить, появились ли с 2023 года насекомоподобные или коннектомные модели с выбором одной цели среди похожих и отказом, проверенные на видео; учесть уже разобранное 16.10 (CSTMD1, STMD,
    Wu–Guo, Cowley) и не повторять. Добавлено: NeuroMechFly v2 с FlyVis (Ramdya lab, Nature Methods 2024) — FlyVis в замкнутой задаче следования за другой мухой; найдено только во вторичном пересказе —
    проверить по оригиналу.'
- id: N16
  group: первая
  name: DAM4SAM (Videnović, Lukežič, Kristan, CVPR 2025; arXiv 2411.17576, 2509.13864) и набор DiDi; EdgeDAM (arXiv 2603.05463)
  description: 'Память с двумя буферами: недавний вид цели и опорные кадры с похожими объектами; обновление по самопроверке без переобучения; DiDi — 180 последовательностей с похожими объектами (отбор по
    DINOv2), отдельная оценка трудного подмножества; EdgeDAM — перенос на рамки, YOLO и CSRT: запись в память только после проверки по IoU и площади, буфер трудных отрицательных кандидатов. Проверить абляции
    правила записи и буфера похожих; число авторов 0,694 против 0,649 у SAM2.1 на DiDi — с выборкой и режимом. Главное возражение: признаки RGB/DINOv2 и маски. Отличие от наших z13_observed_memory_v1 /
    z13_query_memory_v1 — правило записи и явный буфер похожих.'
- id: N17
  group: вторая
  name: SAMURAI (Yang et al., arXiv 2411.11922) и UncTrack (arXiv 2503.12888) — запись в память по проверке движения и неопределённости
  description: 'SAMURAI: выбор среди кандидатов с учётом движения (фильтр Калмана), запись кадра в память только после трёх проверок (сходство маски, присутствие, движение), движение включается после нескольких
    успешных обновлений. UncTrack: предсказание неопределённости положения вместе с рамкой, прототипная память, запись только уверенных образцов. Абляции, числа с выборкой; отличие от нашего ранжирования
    трёх пиков и абсолютной уверенности (z13_absolute_confidence_v1).'
- id: N18
  group: сквозная
  name: Hybrid-SORT (Yang et al., AAAI 2024; arXiv 2308.00783) — слабые признаки в стоимости сопоставления как контроль «правка без мухи»
  description: 'Слабые признаки (динамика уверенности, высота рамки, направление скорости) в стоимости сопоставления без обучения; сильнее всего на DanceTrack. Нужен как обязательный контроль по правилу
    6.16: если слабые признаки без мухи дают тот же эффект, вклад мухи не доказан. Абляции по признакам, HOTA/IDF1 с выборкой; применимость к нашему стенду (BDD100K, YOLO26s, XYWHByteTrack).'
