<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Результаты — YOLO26 + DRB</title>
<style>
@font-face { font-family:'IBM Plex Sans'; font-weight:400; src:url('assets/fonts/ibm-plex-sans-cyrillic-400-normal.woff2') format('woff2'); unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
@font-face { font-family:'IBM Plex Sans'; font-weight:400; src:url('assets/fonts/ibm-plex-sans-latin-400-normal.woff2') format('woff2'); unicode-range:U+0000-00FF,U+2000-206F; }
@font-face { font-family:'IBM Plex Sans'; font-weight:600; src:url('assets/fonts/ibm-plex-sans-cyrillic-600-normal.woff2') format('woff2'); unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
@font-face { font-family:'IBM Plex Mono'; font-weight:400; src:url('assets/fonts/ibm-plex-mono-cyrillic-400-normal.woff2') format('woff2'); unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
@font-face { font-family:'IBM Plex Mono'; font-weight:400; src:url('assets/fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2'); unicode-range:U+0000-00FF,U+2000-206F; }
@font-face { font-family:'IBM Plex Mono'; font-weight:500; src:url('assets/fonts/ibm-plex-mono-cyrillic-500-normal.woff2') format('woff2'); unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }

:root{
  --bg:#faf9f5; --surface:#ffffff;
  --accent:#d97757; --accent-deep:#b85c3c;
  --ink:#2f2a24; --sec:#6b6457; --cap:#a39b8c;
  --line:#2f2a24; --aux:#bdb5a6; --div:#e7e2d8; --ok:#3f9277;
  --sans:'IBM Plex Sans','Segoe UI',sans-serif;
  --mono:'IBM Plex Mono','Cascadia Mono','Consolas',monospace;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:13px; overflow:hidden; user-select:none;}

#app{display:flex; flex-direction:column; height:100vh; padding:22px 26px 14px;}
header{display:flex; align-items:flex-end; justify-content:space-between;
  padding-bottom:10px; border-bottom:1.6px solid var(--line); margin-bottom:14px;}
.kicker{font-family:var(--mono); font-size:9.5px; letter-spacing:.24em;
  color:var(--accent); text-transform:uppercase; margin-bottom:5px;}
h1{font-size:21px; font-weight:600;}
h1 .thin{color:var(--sec); font-weight:400;}
#stamp{font-family:var(--mono); font-size:9.5px; letter-spacing:.14em;
  color:var(--cap); text-transform:uppercase;}

main{flex:1; display:grid; grid-template-columns:1fr 330px; gap:18px; min-height:0;}

.panel{background:var(--surface); border:1.6px solid var(--line); position:relative;
  padding:12px 14px 14px; display:flex; flex-direction:column; min-height:0;}
.panel::before,.panel::after{content:''; position:absolute; width:9px; height:9px; pointer-events:none;}
.panel::before{top:-5px; left:-5px; border-top:1.6px solid var(--line); border-left:1.6px solid var(--line);}
.panel::after{bottom:-5px; right:-5px; border-bottom:1.6px solid var(--line); border-right:1.6px solid var(--line);}
.ptitle{font-family:var(--mono); font-size:10px; letter-spacing:.22em; color:var(--sec);
  text-transform:uppercase; margin-bottom:10px; display:flex; justify-content:space-between;
  align-items:center; cursor:pointer;}
.ptitle .idx{color:var(--accent);}

/* ————— таблица прогонов ————— */
#tablewrap{flex:1; overflow-y:auto; min-height:0; padding-right:4px;}
#tablewrap::-webkit-scrollbar{width:8px;}
#tablewrap::-webkit-scrollbar-thumb{background:var(--div); border:2px solid var(--surface);}
table{width:100%; border-collapse:collapse; font-size:11.5px;}
th{font-family:var(--mono); font-size:8.5px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--cap); text-align:right; padding:4px 6px; border-bottom:1.3px solid var(--div);
  position:sticky; top:0; background:var(--surface);}
th.l,td.l{text-align:left;}
td{padding:4px 6px; border-bottom:1px solid var(--div); text-align:right;
  font-family:var(--mono); font-size:11px;}
td.l{font-family:var(--sans); font-size:11.5px;}
tr.grp td{background:#f6f4ee; font-family:var(--mono); font-size:8.5px;
  letter-spacing:.14em; text-transform:uppercase; color:var(--sec);}

/* ————— разделение по длине обучения —————
   Двенадцать эпох и сто — разные эксперименты с разными контролями, и в
   одном списке они путаются. Разделены размерной линией — тем же приёмом,
   что и заголовки разделов в панели: линия с подписью посередине. */
tr.sect td{padding:16px 0 7px; border-bottom:none; background:none;}
tr.sect:first-child td{padding-top:2px;}
.sline{position:relative; text-align:center;}
.sline::before{content:''; position:absolute; left:0; right:0; top:50%;
  height:1.4px; background:var(--aux);}
.sline span{position:relative; background:var(--surface); padding:0 12px;
  font-family:var(--mono); font-size:9px; letter-spacing:.22em;
  text-transform:uppercase; color:var(--ink);}
.sline b{color:var(--accent); font-weight:400;}

/* Длина обучения полоской: 100 эпох — полная ширина, 12 — короткая.
   У идущего прогона полоса накрашена лишь на пройденную часть. */
.ebar{display:inline-flex; align-items:center; gap:6px; justify-content:flex-end;}
.ebar u{display:block; width:46px; height:5px; background:var(--div);
  position:relative; text-decoration:none; flex:none;}
.ebar u i{position:absolute; left:0; top:0; bottom:0; background:var(--aux);}
.ebar.live u i{background:var(--accent); animation:ebpulse 1.4s ease-in-out infinite;}
@keyframes ebpulse{50%{opacity:.5;}}
.ebar em{font-style:normal; min-width:26px; text-align:right;}
tr.off .ebar u i{background:var(--div);}
/* отключённый прогон виден и зачёркнут — он не исчезает из таблицы,
   иначе о его существовании можно забыть */
tr.off td{color:var(--cap); text-decoration:line-through;}
tr.off td.sw{text-decoration:none;}
td.sw{text-align:center; width:34px;}
td.sw input{cursor:pointer; accent-color:var(--accent-deep); width:13px; height:13px;}
tr:hover td{background:#faf8f3;}
tr.off:hover td{background:#f7f5f0;}

/* ————— сводка справа ————— */
#metrics{display:flex; flex-direction:column; gap:12px; overflow-y:auto; min-height:0;
  padding-right:4px;}
#metrics::-webkit-scrollbar{width:8px;}
#metrics::-webkit-scrollbar-thumb{background:var(--div); border:2px solid var(--surface);}
.mb{border:1.4px solid var(--div); padding:9px 10px 10px;}
.mb h3{font-family:var(--mono); font-size:9.5px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--ink); margin-bottom:2px;}
.mb .msub{font-size:9.5px; color:var(--cap); line-height:1.35; margin-bottom:7px;}
.mrow{border-top:1px solid var(--div); padding-top:6px; margin-top:6px;}
.mrow:first-of-type{border-top:none; padding-top:0; margin-top:0;}
.mlabel{font-family:var(--mono); font-size:8px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--cap); margin-bottom:3px;}
.mline{display:flex; justify-content:space-between; font-family:var(--mono);
  font-size:11px; line-height:1.6;}
.mline .nm{font-family:var(--sans); font-size:11px; color:var(--sec);}
.mdelta{font-family:var(--mono); font-size:13px; font-weight:500; margin-top:3px;}
.mdelta.up{color:var(--ok);} .mdelta.down{color:var(--accent-deep);}
.mnone{font-size:10.5px; color:var(--cap); font-style:italic;}
/* когда отключения меняют вывод — это должно бросаться в глаза */
.mwarn{margin-top:6px; font-size:9.5px; line-height:1.4; color:var(--accent-deep);
  border-top:1px dashed var(--accent); padding-top:5px;
  display:flex; align-items:baseline; gap:6px; justify-content:space-between;}
/* Стрелка показывает, куда отключения двигают вывод: вверх и зелёная —
   заявленная разница выросла, вниз и красная — уменьшилась. */
.mwarn .arr{font-size:14px; line-height:1; flex:none;}
.mwarn .arr.up{color:var(--ok);} .mwarn .arr.down{color:var(--accent-deep);}
.nowarn .mwarn{display:none;}
.mb h3{display:flex; align-items:center; justify-content:space-between; gap:8px;}
/* Внутри величины — по строке на длину обучения. Считать их вместе нельзя:
   расписание разное и контроль у каждой свой. */
.mlen{border-top:1.3px solid var(--div); margin-top:9px; padding-top:8px;}
.mlen:first-of-type{border-top:none; margin-top:2px; padding-top:0;}
.mlenhead{display:flex; align-items:center; justify-content:space-between;
  gap:8px; margin-bottom:5px;}
.mlenname{font-family:var(--mono); font-size:9px; letter-spacing:.18em;
  text-transform:uppercase; color:var(--ink);}
.mlenname b{color:var(--accent); font-weight:400;}
.mbtn{font-family:var(--mono); font-size:8.5px; letter-spacing:.1em;
  text-transform:uppercase; padding:3px 8px; cursor:pointer; flex:none;
  background:var(--surface); color:var(--accent-deep);
  border:1.2px solid var(--accent-deep);}
.mbtn:hover:not(:disabled){background:var(--accent); color:var(--surface);
  border-color:var(--accent);}
.mbtn:disabled{opacity:.35; cursor:default; color:var(--sec);
  border-color:var(--div);}
/* Метка свежести: сколько прогонов не посчитано или устарело. */
.mstale{font-family:var(--mono); font-size:8.5px; letter-spacing:.06em;
  color:var(--accent-deep); margin-bottom:6px;}
.mfresh{font-family:var(--mono); font-size:8.5px; letter-spacing:.06em;
  color:var(--ok); margin-bottom:6px;}

/* Полоса расчёта внизу окна: видно, сколько осталось. */
#job{display:none; margin-top:10px; border:1.4px solid var(--accent-deep);
  padding:7px 10px 8px; background:var(--surface);}
#job.on{display:block;}
#jobtop{display:flex; justify-content:space-between; font-family:var(--mono);
  font-size:9px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--accent-deep); margin-bottom:5px;}
#jobbar{height:7px; background:var(--div); position:relative; overflow:hidden;}
#jobfill{position:absolute; left:0; top:0; bottom:0; width:0%;
  background:var(--accent); transition:width .4s ease;}

/* Панель — элемент сетки и по умолчанию растягивается на всю высоту.
   Чтобы свёрнутая осела в одну строку, ей нужно align-self, а не flex. */
.collapsed #tablewrap{display:none;}
.collapsed{align-self:start;}
.collapsed .ptitle{margin-bottom:0;}
#hint{font-family:var(--mono); font-size:8.5px; letter-spacing:.1em; color:var(--cap);
  text-transform:uppercase; padding-top:9px; display:flex; align-items:center;
  gap:8px; cursor:pointer; user-select:none;}
#hint input{cursor:pointer; accent-color:var(--accent-deep); width:12px;
  height:12px; margin:0; flex:none;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <div class="kicker">Панель управления обучением · результаты</div>
      <h1>Результаты прогонов <span class="thin">· что учитывается в расчёте</span></h1>
    </div>
    <div id="stamp">—</div>
  </header>

  <main>
    <section class="panel" id="tablepanel">
      <div class="ptitle" id="tabletitle">
        <span>Результаты · <span id="cnt">—</span></span>
        <span class="idx" id="fold">свернуть ▲</span>
      </div>
      <div id="tablewrap"><table id="tbl"></table></div>
    </section>

    <section class="panel">
      <div class="ptitle" style="cursor:default"><span>Что из этого следует</span><span class="idx">Сводка</span></div>
      <div id="metrics"></div>
    </section>
  </main>

  <div id="job">
    <div id="jobtop"><span id="jobname">—</span><span id="jobpct">0%</span></div>
    <div id="jobbar"><div id="jobfill"></div></div>
  </div>

  <label id="hint" title="Скрыть строки «Отключения меняют разницу» в сводке">
    <input type="checkbox" id="warnon" checked>
    <span>Снятая галочка — прогон не участвует ни в расчётах, ни на графиках · сводка показана с учётом отключений, строка со стрелкой говорит, что они изменили</span>
  </label>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const fmt = (v, n) => (v === null || v === undefined) ? '—' : v.toFixed(n === undefined ? 4 : n);

function stat(s, n) {
  if (!s) return '—';
  return fmt(s.mean, n) + (s.n > 1 ? '  ±' + fmt(s.sd, n) : '') + '  (n=' + s.n + ')';
}

/* Длина обучения: короткие пробы ровно 12 эпох, полные — до ста.
   Идущий прогон сюда же, по его целевой длине, а не по пройденной. */
const FULL_LEN = 100;
function section(r) { return r.epochs > 12 ? 'full' : 'short'; }

function epochCell(r) {
  const target = section(r) === 'full' ? FULL_LEN : 12;
  const pct = Math.max(4, Math.round(100 * r.epochs / FULL_LEN));
  const running = section(r) === 'full' && r.epochs < FULL_LEN;
  return '<span class="ebar' + (running ? ' live' : '') + '">'
    + '<u><i style="width:' + pct + '%"></i></u>'
    + '<em>' + r.epochs + (running ? '/' + target : '') + '</em></span>';
}

function renderTable(runs) {
  $('cnt').textContent = runs.length + ' прогонов, учитывается '
    + runs.filter(r => r.on).length;
  let html = '<tr><th class="sw"></th><th class="l">прогон</th><th>сид</th>'
    + '<th>эпох</th><th>итог</th><th>пик</th><th>ночь · мелкие</th></tr>';
  const sections = [
    ['short', 'Короткие пробы', '12 эпох', 'сравниваются между собой'],
    ['full', 'Полные прогоны', '100 эпох', 'свой контроль, другое расписание'],
  ];
  sections.forEach(([sid, name, len, note]) => {
    const part = runs.filter(r => section(r) === sid);
    if (!part.length) return;
    html += '<tr class="sect"><td colspan="7"><div class="sline"><span>'
      + name + ' · <b>' + len + '</b> · ' + note + '</span></div></td></tr>';
    const byGroup = {};
    part.forEach(r => { (byGroup[r.group] = byGroup[r.group] || []).push(r); });
    Object.keys(byGroup).sort().forEach(g => {
      html += '<tr class="grp"><td colspan="7">' + g + '</td></tr>';
      byGroup[g].sort((a, b) => a.seed - b.seed).forEach(r => {
        html += '<tr class="' + (r.on ? '' : 'off') + '" data-k="' + r.key + '">'
          + '<td class="sw"><input type="checkbox"' + (r.on ? ' checked' : '') + '></td>'
          + '<td class="l">' + r.group + '</td>'
          + '<td>' + r.seed + '</td><td>' + epochCell(r) + '</td>'
          + '<td>' + fmt(r.final) + '</td><td>' + fmt(r.best) + '</td>'
          + '<td>' + fmt(r.target) + '</td></tr>';
      });
    });
  });
  $('tbl').innerHTML = html;
  $('tbl').querySelectorAll('tr[data-k] input').forEach(cb =>
    cb.addEventListener('change', () => {
      pywebview.api.toggle_run(cb.closest('tr').dataset.k).then(load);
    }));
}

function renderMetrics(blocks) {
  $('metrics').innerHTML = blocks.map(b => {
    const lens = b.lens.map(L => {
      const st = L.state || {};
      const need = (st.missing || []).length + (st.stale || []).length;
      let btn = '', mark = '';
      if (st.why) {
        mark = '<div class="mstale">' + st.why + '</div>';
        btn = '<button class="mbtn" data-b="' + L.id + '" disabled>нечего считать</button>';
      } else if (!st.job) {
        mark = '<div class="mfresh">из кривых обучения · ' + (st.ready || 0) + ' прогонов</div>';
      } else if (need) {
        mark = '<div class="mstale">не посчитано: ' + (st.missing || []).length
          + ((st.stale || []).length ? ' · устарело: ' + st.stale.length : '') + '</div>';
        btn = '<button class="mbtn" data-b="' + L.id + '">▶ посчитать</button>';
      } else {
        mark = '<div class="mfresh">актуально · ' + (st.ready || 0) + ' прогонов</div>';
        btn = '<button class="mbtn" data-b="' + L.id + '" disabled>актуально</button>';
      }
      let body;
      if (!L.control && !L.block) {
        body = '<div class="mnone">' + (st.why ? 'сравнивать нечего' : 'не посчитано') + '</div>';
      } else {
        const cls = L.delta === null ? '' : (L.delta >= 0 ? ' up' : ' down');
        const d = L.delta === null ? '' : '<div class="mdelta' + cls + '">'
          + (L.delta >= 0 ? '+' : '') + fmt(L.delta) + '</div>';
        body = '<div class="mline"><span class="nm">без блока</span><span>'
          + stat(L.control) + '</span></div>'
          + '<div class="mline"><span class="nm">с блоком</span><span>'
          + stat(L.block) + '</span></div>' + d;
      }
      // строка со стрелкой — только если отключения реально сдвинули вывод
      let warn = '';
      if (L.delta !== null && L.delta_all !== null
          && Math.abs(L.delta - L.delta_all) > 1e-9) {
        const up = L.delta > L.delta_all;
        warn = '<div class="mwarn"><span>Отключения меняют разницу с '
          + fmt(L.delta_all) + ' на ' + fmt(L.delta) + '</span>'
          + '<span class="arr ' + (up ? 'up">▲' : 'down">▼') + '</span></div>';
      }
      return '<div class="mlen"><div class="mlenhead">'
        + '<span class="mlenname"><b>' + L.label + '</b></span>' + btn + '</div>'
        + mark + body + warn + '</div>';
    }).join('');
    return '<div class="mb"><h3><span>' + b.title + '</span></h3>'
      + '<div class="msub">' + b.sub + '</div>' + lens + '</div>';
  }).join('');
}

function renderJob(j) {
  const box = $('job');
  if (!j || !j.running) {
    box.classList.remove('on');
    return false;
  }
  box.classList.add('on');
  $('jobname').textContent = 'Считаю · ' + (j.block || '') + ' · ' + (j.text || '');
  $('jobpct').textContent = (j.percent || 0).toFixed(0) + '%  ·  осталось '
    + (100 - (j.percent || 0)).toFixed(0) + '%';
  $('jobfill').style.width = (j.percent || 0) + '%';
  return true;
}

function load() {
  return pywebview.api.state().then(d => {
    $('stamp').textContent = d.stamp || '';
    renderTable(d.runs || []);
    renderMetrics(d.blocks || []);
    document.querySelectorAll('.mbtn:not(:disabled)').forEach(b =>
      b.addEventListener('click', () => {
        b.disabled = true;
        pywebview.api.compute(b.dataset.b).then(r => {
          $('stamp').textContent = r.text || '';
          if (r.ok) poll(); else b.disabled = false;
        });
      }));
    renderJob(d.job);
  });
}

/* Пока расчёт идёт — опрашиваем состояние раз в две секунды. Когда
   закончился, перечитываем таблицу: числа уже на диске. */
let polling = null;
function poll() {
  if (polling) return;
  polling = setInterval(() => {
    pywebview.api.state().then(d => {
      if (!renderJob(d.job)) {
        clearInterval(polling); polling = null;
        load();
      }
    });
  }, 2000);
}

function applyWarn() {
  const on = $('warnon').checked;
  document.body.classList.toggle('nowarn', !on);
  try { localStorage.setItem('warnon', on ? '1' : '0'); } catch (e) {}
}
try { $('warnon').checked = localStorage.getItem('warnon') !== '0'; } catch (e) {}
$('warnon').addEventListener('change', applyWarn);
applyWarn();

$('tabletitle').addEventListener('click', () => {
  const p = $('tablepanel');
  p.classList.toggle('collapsed');
  $('fold').textContent = p.classList.contains('collapsed') ? 'развернуть ▼' : 'свернуть ▲';
});

window.onerror = (m, s, l) => { $('stamp').textContent = 'JS: ' + m + ' @' + l; };
let booted = false;
function boot() {
  if (booted || !window.pywebview || !window.pywebview.api
      || typeof window.pywebview.api.state !== 'function') return;
  booted = true; load();
}
window.addEventListener('pywebviewready', boot);
setInterval(boot, 200);
</script>
</body>
</html>
