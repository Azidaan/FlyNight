topic: 'Критический выбор одной модернизации FlyVis для узнавания прежней цели по образцу среди похожих соседей и надёжного отказа (З13, многообъектный трекинг)'
created: '2026-10-16'
questions_ranked:
- id: Q1
  text: 'Какие механизмы позволяют по образцу узнавать конкретный объект среди похожих и отказываться при его отсутствии; есть ли прямые результаты для коннектомных или насекомоподобных сетей, а не только детекторов движения?'
  assumptions: 'Наш провал — в выборе прежней цели и в отказе, а не в обнаружении движения; образец из 4 последних наблюдений трекера достаточно надёжен.'
  sources_needed: 'Tschopp 2018; Cowley 2024 (LC, knockout training); стрекоза CSTMD1 (избирательное внимание, предсказательное усиление); DiMP/KeepTrack/ToMP (отвлекающие объекты, отсутствие цели).'
  answer_changes_if: 'Найден насекомоподобный механизм выбора одной из двух похожих целей с количественной проверкой на видео с подвижной камерой — тогда приоритет ему; если такие результаты только в электрофизиологии на простых стимулах — переносимость низкая.'
- id: Q2
  text: 'Как отличить ограничение представления FlyVis от неудачного считывания и обучения; что обоснованнее менять — вход, образец, считывание, ядро, динамику или перенос состояния?'
  assumptions: 'Сравнения B / C / D и пилоты считывания не разделяют эти причины; 721 фасетка серого входа может терять детали.'
  sources_needed: 'Работы с пробами представления (linear probes), сравнением замороженного и обученного ядра, нулевыми моделями коннектома (Beiran, Litwin-Kumar; Lappalainen ансамбль; Tschopp случайная инициализация).'
  answer_changes_if: 'Есть опубликованная процедура, разделяющая информацию в представлении и качество считывания на одинаковых наблюдениях.'
- id: Q3
  text: 'При каких размерах цели, разрешении глаза, частоте кадров, движении камеры и отношении движения объекта к фону опубликованные механизмы работают; что меняется при наших вырезках и 30 Гц?'
  assumptions: 'Наши цели — около 9 × 12 шагов решётки; вырезка движется и меняет масштаб; 30 Гц; камера движется.'
  sources_needed: 'vSTMD, STMD с обратной связью и предсказанием (Wang, Yue), Wu–Guo, эфферентная копия и стабилизация взгляда у дрозофилы (Kim 2015, Fenk).'
  answer_changes_if: 'Механизм проверен на подвижной камере при 25–30 Гц и целях > 5 фасеток.'
- id: Q4
  text: 'Как совместно обучать положение и надёжный отказ, чтобы высокая уверенность означала полезную поправку (оценка качества локализации, избирательное предсказание)?'
  assumptions: 'Сейчас вероятность присутствия плохо отделяет полезные поправки (7 из 37 известных в верхнем 1 %).'
  sources_needed: 'IoU-Net, ATOM, GFL/качество локализации; SelectiveNet, Geifman–El-Yaniv, конформный контроль риска; оценки отсутствия цели в трекерах.'
  answer_changes_if: 'Есть прямые результаты, где отдельная голова качества улучшает отбор вмешательств при сдвиге распределения.'
- id: Q5
  text: 'Какой один механизм реально проверить на 12 ГБ; как отделить вклад FlyVis от считывателя, входа, дополнительного обучения и вычислений?'
  assumptions: 'Бюджет — часы GPU; один процесс; сравнение с B (без FlyVis) и C (замороженная FlyVis) на одинаковых наблюдениях и истории.'
  sources_needed: 'Все позиции; контроли нулевых моделей и равного вычислительного бюджета.'
  answer_changes_if: 'Минимальная проверка требует данных или вычислений, которых нет.'
context: 'Предмет — модернизированная FlyVis (Lappalainen et al., Nature 2024; ядро 734 обучаемых параметра, вход 721 серая фасетка на шестиугольной решётке, 34 типа выходных клеток). Стенд YOLO26s + XYWHByteTrack + MASA, 30 Гц, кадры 1280×720, HOTA, парный бутстрэп по видео. Глаз — вырезка вокруг прогноза трека: квадрат max(2 × большая сторона, 64 px), перемещается и меняет масштаб. Задача З13: 4 последних наблюдения — образец; во время потери найти именно прежний объект среди похожих соседей или отказаться; при положительном решении — поправка центра прогноза перед сопоставлением. Уже сделано (контекст проекта, не независимая проверка): FlyVis обучалась потоку Sintel; дообучение на потоке DIS без пользы; ядро и считыватель обучались объектной функции; пространственное считывание по образцу с локальными соседствами и вниманием; варианты B (сеть без FlyVis, ~9602 параметра), C (замороженная), D (обученная), общий считыватель ~11 746 параметров; распределённая цель +5,94 п.п. полезных центров относительно точечной в парном продолжении (не HOTA); подавление окружения, размеры рамки, адаптивное накопление (по 500 шагов, один сид) не прошли критерий; медианная рамка 9,37 × 12,06 шага решётки; верхний 1 % уверенности — полезны 7 из 37 известных; прежняя пространственная версия с MASA HOTA 61,6548 → 61,6727, по видео +0,0087 [−0,0299; +0,0561], не подтверждено. Уже цитировались в проекте: Tschopp 1806.04793, Wu–Guo 10.1371/journal.pcbi.1011077, vSTMD 2501.13054, Fu–Yue 2007.00886, Wang 2104.13018, GOTURN, DiMP, PrDiMP, KeepTrack, STARK, SiamRPN++, Kuklev 2609.24565 — их нужно перепроверить по полному тексту, а не пересказывать.'
items:
- id: I1
  name: 'Tschopp Reiser Turaga 2018 connectome-constrained object tracking (arXiv 1806.04793)'
  description: 'Verify all versions (v1/v2), full text, appendix, code if any. Exact task and output (object centroid and velocity?), data (which DAVIS videos, number of independent videos, train/test split within same videos?), input resolution (number of ommatidia) and target size in ommatidia, frame rate and camera motion, trainable nodes and loss, controls (random init, fixed weights, shuffled connectome), seeds, metric and exact numbers with location in paper. Did they test unseen videos, target absence, similar distractors, occlusion, night, sequential operation on own predictions? Forward citations (who built on it, 2019–2026). What this implies for a FlyVis object readout trained through the core in a multi-object tracker (find the previous target among similar neighbours or refuse). Do not claim anatomy advantage if random networks matched.'
- id: I2
  name: 'Lappalainen et al. 2024 FlyVis (Nature) and later works that retrain or reuse FlyVis for non-flow tasks'
  description: 'Primary paper (Nature 2024, s41586-024-07939-3) and code (TuragaLab/flyvis): what exactly is trained (734 params?), task (optic flow on Sintel), input lattice (721 hexals), integration dt, ensemble, what the paper says about task-dependence and about random/shuffled connectome controls. Then forward citations 2024–2026 that fine-tune or reuse FlyVis for other tasks (object detection, looming, tracking, descriptors, e.g. Kuklev arXiv 2609.24565 if it exists). For each: task, data, whether training the core helped beyond input features, controls. Implications for using FlyVis as a target-conditioned localizer with refusal.'
- id: I3
  name: 'Cowley et al. 2024 Nature knockout training of LC neurons and Drosophila visual pursuit (LC10, courtship)'
  description: 'Cowley, Calhoun, Rangarajan, Ireland, Turner, Pillow, Murthy 2024 Nature "Mapping model units to visual neurons reveals population code for social behaviour": model of lobula columnar (LC) neuron bottleneck predicting male behaviour from female position/size; knockout training. Plus Ribeiro et al. 2018 Cell (LC10 directed courtship) and Hindmarsh Sten et al. 2021 Nature (arousal gates visual processing; LC10a pursuit). Extract: how object position/size/identity of ONE target is encoded (population code across LC types), whether there are distractors, what inputs (rendered female vs video), camera/self-motion, frame rate, training and controls, numbers. What this suggests as an object-readout node downstream of FlyVis outputs (LC-like bottleneck) and its limits for our task.'
- id: I4
  name: 'Dragonfly CSTMD1 selective attention and predictive gain modulation (Wiederman, O Carroll and models)'
  description: 'Wiederman and O Carroll 2013 Current Biology "Selective attention in an insect visual neuron"; Wiederman et al. 2017 eLife "A predictive focus of gain modulation encodes target trajectories in insect vision"; later work (Lancer, Evans, Fabian, O Carroll; Bagheri et al. models of target tracking in clutter, e.g. "An autonomous robot inspired by insect neurophysiology pursues moving features in natural environments" 2017; facilitation models). Extract mechanism: choosing one of two targets, facilitation ahead of predicted trajectory, robustness to occlusion and clutter; stimuli (small targets of 1–3 degrees), frame rates, camera motion, quantitative results and data. Assess transfer to a target-conditioned FlyVis localizer that must re-find the previous target among similar neighbours after loss, at 30 Hz with moving crops and targets ~9x12 lattice steps.'
- id: I5
  name: 'Wu and Guo 2023 PLoS Comput Biol bioinspired figure-ground discrimination via visual motion smoothing (EMD-lobula)'
  description: 'DOI 10.1371/journal.pcbi.1011077, code github sapid2021wu/EMD-Lobula-network. Verify full text and code: architecture, inputs, stimuli (bars on HDR scenes?), camera/background motion, failure when target and background move together, quantitative metrics, whether any learning is involved, number of independent sequences. Assess transfer to FlyVis lobula-like readout for target vs background separation inside a moving tracking crop; what our simplified one-gain surround subtraction did not reproduce.'
- id: I6
  name: 'Small target motion detection lineage: vSTMD (arXiv 2501.13054), feedback and prediction STMD (Wang, Yue et al.), Fu and Yue review (arXiv 2007.00886)'
  description: 'Verify vSTMD versions and code (github MingshuoXu/vSTMD): task, datasets (RIST etc.), resolution, frame rate (240 Hz?), target size, metrics. Wang et al. feedback STMD (TNNLS) and attention/prediction-guided STMD (arXiv 2104.13018): prediction module, how it handles occlusion and clutter, frame rate, metrics. Fu and Yue 2007.00886: what it actually is (review of insect motion detectors for robots?) and what it states about limits. Separate each paper; note preprint vs journal duplicates. Assess which mechanism (temporal prediction feedback, facilitation) could become a FlyVis node for re-finding a lost target at 30 Hz with targets much larger than STMD targets.'
- id: I7
  name: 'Efference copy and gaze stabilisation in Drosophila vision and computational use for moving eye crops'
  description: 'Kim, Fitzgerald, Maimon 2015 Nature Neuroscience (cellular evidence for efference copy in Drosophila visuomotor processing); Kim et al. 2017; Fenk et al. 2021/2022 (suppression of motion vision during saccades / course-changing turns); Cruz et al. or others on gaze stabilisation. Extract: what signal is cancelled, timing, magnitude, which cells (HS/VS), quantitative results. Computational models that subtract expected self-motion from motion-detector outputs. Assess relevance for our moving and rescaling crop (eye moves with track prediction): does literature support remapping neuron state or subtracting predicted crop motion, and what failed in similar engineering attempts.'
- id: I8
  name: 'Target-conditioned distractor-aware tracking with explicit target-absent handling (DiMP, PrDiMP, KeepTrack, ToMP, long-term trackers)'
  description: 'Verify primary sources: DiMP (arXiv 1904.07220), PrDiMP (CVPR 2020), KeepTrack (arXiv 2103.16556), ToMP (arXiv 2203.11192), and a long-term tracker with explicit target-absent / re-detection evaluation (e.g., LTMU CVPR 2020 "High-performance long-term tracking with meta-updater", or VOT-LT / LaSOT absent frames). Extract mechanisms: discriminative target model learned online from exemplar frames, distractor association, absent prediction and re-detection, how confidence is calibrated; datasets, number of videos, frame rates, metrics and numbers; ablations isolating distractor handling and absence. What minimal mechanism could be implemented as a FlyVis readout node (not an external tracker) with ~11k parameter readout and 721-column features.'
- id: I9
  name: 'Localization quality estimation aligned with usefulness (IoU-Net, ATOM, Generalized Focal Loss, quality heads)'
  description: 'IoU-Net (Jiang et al. ECCV 2018, arXiv 1807.11590), ATOM (Danelljan et al. CVPR 2019, IoU prediction for tracking), Generalized Focal Loss (Li et al. NeurIPS 2020, quality-classification joint representation), and any tracking work showing that a separately trained localization-quality head selects useful corrections better than classification confidence. Extract mechanism, training targets, data, metrics and numbers, ablations (confidence vs IoU-quality ranking). Assess how to train a FlyVis readout so that its intervention score predicts that the corrected centre is useful (error below standard prediction), and how to validate it by video-level splits.'
- id: I10
  name: 'Selective prediction and reject option for safe interventions (SelectiveNet, Geifman and El-Yaniv, conformal risk control)'
  description: 'Geifman and El-Yaniv 2017 NeurIPS (selective classification for deep networks), SelectiveNet ICML 2019, conformal risk control (Angelopoulos et al. 2022, arXiv 2208.02814) and any application to tracking or detection under distribution shift. Extract: how coverage-risk trade-off is set, guarantees and their assumptions (exchangeability), behaviour under shift, minimum calibration set sizes. Assess applicability to choosing tau for FlyVis interventions with video-level splits (train104 / train26 / dev35 / heldout75) and the observed weak confidence (7 of 37 useful in top 1 percent).'
- id: I11
  name: 'Do connectome constraints improve task performance versus random or shuffled networks (null models, Beiran and Litwin-Kumar, others)'
  description: 'Find primary works testing whether connectome-constrained networks outperform random/shuffled/size-matched networks on tasks or only improve neural-activity prediction: e.g., Beiran and Litwin-Kumar (prediction of neural activity in connectome-constrained recurrent networks, 2023/2024), Lappalainen 2024 controls, Tschopp 2018 random init, other 2024–2026 works on Drosophila connectome-based models (e.g., FlyWire-based whole-brain models, Shiu et al. 2024 Nature). Extract controls and numbers. Implication: what comparison would establish that FlyVis (not readout or extra training) causes a tracking benefit; how to design matched controls beyond parameter count (same observations, history, training steps, compute).'
- id: I12
  name: 'Chinese-language and Chinese-group research on fly or insect vision for target tracking (果蝇视觉, 视觉连接组, 小目标运动检测, 目标跟踪, 图形背景分离, 遮挡)'
  description: 'Search in Chinese and English for Chinese groups (e.g., Guangzhou University / Hongxin Wang, Qinbing Fu; Institute of Biophysics CAS / Aike Guo; Harbin Institute of Technology; Zhejiang University) working on Drosophila or insect-inspired visual target tracking, small target motion detection, figure-ground segregation, occlusion handling, adaptive temporal filtering. Use queries: 果蝇视觉 目标跟踪, 视觉连接组 模型, 小目标运动检测 仿生, 图形背景分离 昆虫, 遮挡 目标跟踪 仿生, 自适应时间滤波 运动检测. Identify 2–4 primary sources not already in the list (exclude Wu-Guo 2023, vSTMD, Wang 2104.13018 unless new versions), with full text check, data, metrics, and whether they handle target identity among similar distractors or absence.'
execution:
  batch_size: 6
  items_per_agent: 1
  output_dir: ./research_flyvis_mechanism_2026-10-16/results
